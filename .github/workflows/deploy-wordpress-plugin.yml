name: Deploy WordPress Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the deployment without committing to WordPress.org
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: wordpress-org-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion rsync

      - name: Deploy to WordPress.org SVN
        env:
          WPORG_USERNAME: ${{ secrets.WPORG_USERNAME }}
          WPORG_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          SVN_URL: https://plugins.svn.wordpress.org/repeaterly
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          IS_TAG_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          echo "Deploying WordPress plugin to SVN..."

          PLUGIN_VERSION="$(sed -n 's/^Stable tag:[[:space:]]*//Ip' readme.txt | tr -d '\r' | head -n 1)"
          PHP_VERSION="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' repeaterly.php | tr -d '\r' | head -n 1)"

          if [[ ! "$PLUGIN_VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid or missing Stable tag in readme.txt: '$PLUGIN_VERSION'" >&2
            exit 1
          fi

          if [ "$PLUGIN_VERSION" != "$PHP_VERSION" ]; then
            echo "Version mismatch: readme.txt is $PLUGIN_VERSION but repeaterly.php is $PHP_VERSION" >&2
            exit 1
          fi

          if [ "$IS_TAG_RELEASE" = "true" ] && [ "$GIT_TAG" != "v$PLUGIN_VERSION" ]; then
            echo "Git tag $GIT_TAG does not match plugin version v$PLUGIN_VERSION" >&2
            exit 1
          fi

          echo "Plugin version detected: $PLUGIN_VERSION"

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          echo "Checking out SVN into $TMP_DIR"
          svn checkout "$SVN_URL" "$TMP_DIR" \
            --username "$WPORG_USERNAME" \
            --password "$WPORG_PASSWORD" \
            --non-interactive \
            --no-auth-cache

          echo "Copying plugin files to trunk..."
          rsync -av --delete --delete-excluded \
            --exclude-from=.distignore \
            ./ "$TMP_DIR/trunk/"

          if [ -d "./wp-assets" ]; then
            echo "Updating WordPress.org directory assets..."
            rsync -av --delete ./wp-assets/ "$TMP_DIR/assets/"
          fi

          cd "$TMP_DIR"

          # Schedule new files and remove files deleted from Git or excluded by .distignore.
          svn add --force trunk assets
          while IFS= read -r status_line; do
            if [ "${status_line:0:1}" = "!" ]; then
              svn delete --force "${status_line:8}"
            fi
          done < <(svn status)

          if [ -e "tags/$PLUGIN_VERSION" ]; then
            echo "SVN tag $PLUGIN_VERSION already exists; refusing to overwrite a released version." >&2
            exit 1
          fi

          echo "Creating SVN tag $PLUGIN_VERSION from trunk..."
          svn copy trunk "tags/$PLUGIN_VERSION"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run mode ON. No commit will be made."
            svn status
            exit 0
          fi

          echo "Committing to WordPress SVN..."
          svn commit \
            -m "Deploy version $PLUGIN_VERSION" \
            --username "$WPORG_USERNAME" \
            --password "$WPORG_PASSWORD" \
            --non-interactive \
            --no-auth-cache
